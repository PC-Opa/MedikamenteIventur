<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Medikamenten-Inventar</title>
<link rel="icon" type="image/png" href="Apolcon.png?v=2"><link rel="apple-touch-icon" href="Apolcon.png?v=2"><link rel="icon" sizes="192x192" href="Apolcon.png?v=2"><link rel="shortcut icon" href="Apolcon.png?v=2">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:0 auto;padding:15px;background:#f6f8fa;color:#24292f}h1{border-bottom:2px solid #d0d7de;padding-bottom:10px;margin-bottom:20px;font-size:24px}.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px #0000000d}label{font-weight:bold;display:block;margin-bottom:8px}input[type=date]{padding:10px;font-size:16px;border:1px solid #d0d7de;border-radius:6px;width:100%;box-sizing:border-box;max-width:250px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;min-width:850px;table-layout:fixed}th,td{border:1px solid #d0d7de;padding:10px;text-align:left;overflow-wrap:anywhere}th{background:#f6f8fa;font-weight:bold}tr:nth-child(even){background:#f9fafb}th:nth-child(1){width:18%}th:nth-child(2){width:9%}th:nth-child(3){width:12%}th:nth-child(4){width:15%}th:nth-child(5){width:10%}th:nth-child(6){width:17%}th:nth-child(7){width:12%}th:nth-child(8){width:11%}.input-stock{width:65px;max-width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid #0969da;border-radius:6px;text-align:center;font-weight:bold}.status-green,.status-yellow,.status-red{font-weight:bold;padding:5px 7px;border-radius:6px;display:inline-block}.status-green{background:#dafbe1;color:#1a7f37}.status-yellow{background:#fff8c5;color:#9a6700}.status-red{background:#ffebe9;color:#cf222e}
</style></head><body>
<h1>📋 Mein Medikamenten-Inventar</h1>
<button id="sync-button" style="background:#2da44e;color:white;border:0;padding:10px 20px;font-size:15px;font-weight:bold;border-radius:6px;cursor:pointer;margin-bottom:15px">🔄 Änderungen in GitHub-Tabelle speichern</button><div id="sync-message" role="status" style="margin-bottom:12px"></div>
<div class="card"><label for="target-date">📅 Wunschdatum in der Zukunft wählen:</label><input type="date" id="target-date"></div>
<div class="card table-container"><table><thead><tr><th>Medikament</th><th>PZN</th><th>Inhalt (Packung)</th><th>Aktueller Restbestand</th><th>Bedarf</th><th>Bestand am Wunschdatum</th><th>Reicht ab da noch...</th><th>Status</th></tr></thead><tbody id="med-table-body"></tbody></table></div>
<script>
const meds=[
{id:'gabapentin',name:'Gabapentin Micro Labs 300 mg',pzn:'20298705',pack:'100 Stk.',stock:100,dose:3,unit:'Stk.'},
{id:'metformin',name:'Metformin Lich 1000 mg',pzn:'00488687',pack:'180 Stk.',stock:100,dose:2,unit:'Stk.'},
{id:'ozempic',name:'Ozempic 2mg (Mittwoch)',pzn:'01016397',pack:'12 Dosen',stock:0,dose:1/7,unit:'Dosen'},
{id:'pravastatin',name:'Pravastatin 20 mg',pzn:'04857714',pack:'100 Stk.',stock:90,dose:1,unit:'Stk.'},
{id:'omeprazol',name:'Omeprazol 40 mg',pzn:'10517106',pack:'100 Stk.',stock:100,dose:1,unit:'Stk.'},
{id:'metohexal',name:'MetoHexal 50 mg',pzn:'02559964',pack:'100 Stk.',stock:100,dose:1,unit:'Stk.'},
{id:'metoprolol',name:'MetoProlol A-Z',pzn:'01983619',pack:'100 Stk.',stock:100,dose:1,unit:'Stk.'},
{id:'ultibro',name:'Ultibro 85ug/43ug',pzn:'03852962',pack:'100 Inh.',stock:100,dose:1,unit:'Inh.'},
{id:'ramilich',name:'RamiLich 2,5 mg',pzn:'08839133',pack:'100 Stk.',stock:180,dose:1,unit:'Stk.'}
];
// Configure these two values with the GitHub account and repository name.
const GITHUB_OWNER='pc-opa';const GITHUB_REPO='MedikamentenInventur';const GITHUB_BRANCH='main';const INVENTORY_FILE='medikamentenbestand.json';
const today=new Date();today.setHours(0,0,0,0);const dateInput=document.getElementById('target-date');dateInput.value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const body=document.getElementById('med-table-body');
function render(){body.innerHTML='';for(const m of meds){const saved=localStorage.getItem('stock_'+m.id);if(saved!==null)m.stock=Math.max(0,parseInt(saved,10)||0);const tr=document.createElement('tr');tr.innerHTML=`<td><strong>${m.name}</strong></td><td><small>${m.pzn}</small></td><td><strong>${m.pack}</strong></td><td><input type="number" class="input-stock" min="0" step="1" value="${m.stock}" aria-label="Restbestand ${m.name}"></td><td><small>${m.dose===1/7?'1x wöchentlich':m.dose+' / Tag'}</small></td><td class="future">–</td><td class="reach">–</td><td class="status">–</td>`;const input=tr.querySelector('input');input.addEventListener('input',()=>{m.stock=Math.max(0,parseInt(input.value,10)||0);localStorage.setItem('stock_'+m.id,m.stock);calculate()});body.appendChild(tr)}calculate()}
function calculate(){const target=new Date(dateInput.value+'T00:00:00');const days=Math.max(0,Math.floor((target-today)/86400000));[...body.rows].forEach((row,i)=>{const m=meds[i];const future=m.stock-days*m.dose;const remaining=Math.max(0,Math.floor(future/m.dose));row.cells[5].textContent=`${Math.max(0,Math.floor(future*100)/100)} ${m.unit}`;row.cells[6].textContent=`${remaining} Tage`;const status=row.cells[7];status.className='status';if(future<=0){status.textContent='Reicht nicht';status.classList.add('status-red')}else if(remaining<30){status.textContent='Bald knapp';status.classList.add('status-yellow')}else{status.textContent='Ausreichend';status.classList.add('status-green')}})}
dateInput.addEventListener('change',calculate);
function message(text,isError=false){const el=document.getElementById('sync-message');el.textContent=text;el.style.color=isError?'#cf222e':'#1a7f37'}
async function loadSharedInventory(){if(GITHUB_OWNER.startsWith('YOUR_')||GITHUB_REPO.startsWith('YOUR_')){render();message('GitHub-Konto und Repository müssen noch in der Konfiguration eingetragen werden.',true);return}try{const url=`https://api.github.com/repos/${encodeURIComponent(GITHUB_OWNER)}/${encodeURIComponent(GITHUB_REPO)}/contents/${INVENTORY_FILE}?ref=${encodeURIComponent(GITHUB_BRANCH)}`;const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(response.status===404){render();return}if(!response.ok)throw new Error(`GitHub-Laden fehlgeschlagen (${response.status})`);const file=await response.json();const data=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\s/g,'')))));for(const med of meds){if(Number.isFinite(data.stocks?.[med.id])){med.stock=Math.max(0,Math.floor(data.stocks[med.id]));localStorage.setItem('stock_'+med.id,String(med.stock))}}render();message('Gemeinsamer Bestand aus GitHub geladen.')}catch(error){render();message(`GitHub-Bestand konnte nicht geladen werden: ${error.message}`,true)}}
async function syncWithGitHub(){if(GITHUB_OWNER.startsWith('YOUR_')||GITHUB_REPO.startsWith('YOUR_')){message('Bitte zuerst GitHub-Benutzername und Repository in der Konfiguration eintragen.',true);return}const token=window.prompt('GitHub Personal Access Token mit Contents: Read and write einfügen. Der Token wird nicht gespeichert.');if(!token)return;const button=document.getElementById('sync-button');button.disabled=true;button.textContent='⏳ Speichere in GitHub…';try{const base=`https://api.github.com/repos/${encodeURIComponent(GITHUB_OWNER)}/${encodeURIComponent(GITHUB_REPO)}/contents/${INVENTORY_FILE}`;const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};const existing=await fetch(`${base}?ref=${encodeURIComponent(GITHUB_BRANCH)}`,{headers});let sha;if(existing.ok){sha=(await existing.json()).sha}else if(existing.status!==404){throw new Error(`GitHub-Lesen fehlgeschlagen (${existing.status})`)}const data={updatedAt:new Date().toISOString(),stocks:Object.fromEntries(meds.map(m=>[m.id,m.stock]))};const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+'\n')));const response=await fetch(base,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Medikamentenbestand aktualisieren',content,branch:GITHUB_BRANCH,...(sha?{sha}:{})})});if(!response.ok){const detail=await response.json().catch(()=>({}));throw new Error(`${response.status}: ${detail.message||'Speichern fehlgeschlagen'}`)}message('✅ Bestand in GitHub gespeichert. Beim nächsten Öffnen laden Desktop und Handy denselben Stand.')}catch(error){message(`Speichern fehlgeschlagen: ${error.message}`,true)}finally{button.disabled=false;button.textContent='🔄 Änderungen in GitHub-Tabelle speichern'}}
document.getElementById('sync-button').addEventListener('click',syncWithGitHub);loadSharedInventory();
</script></body></html>
