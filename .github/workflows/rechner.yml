name: Medikamenten-Rechner Automatisch

on:
  push:
    paths:
      - 'rechner.py'
  workflow_dispatch:

jobs:
  run-calculator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Berechnung ausführen
      run: python rechner.py

    - name: Änderungen automatisch speichern
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        git diff-index --quiet HEAD || git commit -m "Tabelle automatisch aktualisiert"
        git push
